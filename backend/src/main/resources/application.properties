spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:crossfade}
spring.datasource.username=${POSTGRES_USER:crossfade}
spring.datasource.password=${POSTGRES_PASSWORD:crossfade}

sidecar.base-url=${SIDECAR_URL:http://localhost:8000}

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
