services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crossfade}
      POSTGRES_USER: ${POSTGRES_USER:-crossfade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crossfade}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crossfade} -d ${POSTGRES_DB:-crossfade}"]
      interval: 5s
      timeout: 5s
      retries: 10

  sidecar:
    build: ./sidecar
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-crossfade}
      POSTGRES_USER: ${POSTGRES_USER:-crossfade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crossfade}
      SIDECAR_URL: http://sidecar:8000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      sidecar:
        condition: service_healthy

volumes:
  postgres-data:
